# Upstream zmkfirmware/zmk: Studio on left via local totem-studio-rpc (drops extra
# Totem console CDC so zmk.studio can attach). Passkey in totem.conf.
include:
  - board: xiao_ble//zmk
    shield: totem_left
    snippet: totem-studio-rpc
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
  - board: xiao_ble//zmk
    shield: totem_right
  - board: xiao_ble//zmk
    shield: settings_reset
