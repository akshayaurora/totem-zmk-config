# Upstream zmkfirmware/zmk. Studio is on the left half via build.yaml
# (snippet studio-rpc-usb-uart). Passkey pairing: unplug USB, Connect,
# type the 6 digits, then Enter.

CONFIG_ZMK_KEYBOARD_NAME="Totem"
CONFIG_ZMK_BLE=y
CONFIG_BT=y
CONFIG_ZMK_SLEEP=n

CONFIG_ZMK_BLE_PASSKEY_ENTRY=y
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

CONFIG_ZMK_SPLIT_BLE_PREF_INT=12
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=400
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n

CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24

# After the selected host is gone this many minutes, stop advertising.
# A keypress restarts advertising (that key may be lost). Central only.
CONFIG_TOTEM_ADV_THROTTLE=y
CONFIG_TOTEM_ADV_THROTTLE_TIMEOUT_MIN=5
