# Upstream zmkfirmware/zmk + passkey. Studio is on the left half via build.yaml
# (snippet studio-rpc-usb-uart), not this flag — y here would also enable it
# on the right half with no RPC.
# Pairing: unplug USB, Connect on the host, type the 6 digits, then Enter
# (right inner thumb tap, or hold left Backspace for the number row).

CONFIG_ZMK_KEYBOARD_NAME="Totem"
CONFIG_ZMK_BLE=y
CONFIG_BT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_SLEEP=n

# Restore the type-the-code pairing flow that last worked on this Mac.
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# Allow replacing a leftover Just Works / mismatched bond during re-pair.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# macOS often reconnects without re-subscribing to HID notifications.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Split link: 15 ms interval, default 4 s supervision. No +8 dBm TX bump.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=12
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=400
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n

CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24

# This module's Kconfig defaults compile fork helpers (reconnect watch,
# host-event log, boot dumps). Those call patched ZMK APIs. Force them off.
CONFIG_TOTEM_FAULT_CAPTURE=n
CONFIG_TOTEM_WATCHDOG=n
CONFIG_TOTEM_RESET_REASON_CAPTURE=n
CONFIG_TOTEM_BOOT_PROFILE_DUMP=n
CONFIG_TOTEM_ENDPOINT_LOG=n
CONFIG_TOTEM_BATTERY_LOG=n
CONFIG_TOTEM_USB_CONSOLE=n
CONFIG_TOTEM_EXCLUSIVE_HOST=n
CONFIG_TOTEM_LAZY_INACTIVE_HOST=n
CONFIG_TOTEM_BOND_HEAL=n
CONFIG_TOTEM_RESELECT_RECONNECT=n
CONFIG_TOTEM_ACTIVE_ADV_FILTER=n
CONFIG_TOTEM_RECONNECT_WATCH=n
CONFIG_TOTEM_THRASH_DETECT=n
CONFIG_TOTEM_HOST_EVENT_LOG=n
CONFIG_TOTEM_ADV_THROTTLE=n
CONFIG_TOTEM_ADV_BOOST=n
CONFIG_TOTEM_ADV_POST_SWITCH_DARK=n
CONFIG_TOTEM_DIR_THEN_OPEN=n
CONFIG_TOTEM_IDLE_DISCONNECT=n
CONFIG_TOTEM_RPA_DISCONNECT=n
CONFIG_TOTEM_ADV_RECONCILE=n
CONFIG_TOTEM_RECOVERY_REBOOT=n
